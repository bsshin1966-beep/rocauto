<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive Video Player</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <main class="video-section">
            <div class="video-wrapper">
                <video id="my-video" controls preload="metadata"
                    poster="https://img.youtube.com/vi/VMazjZMqQkI/maxresdefault.jpg">
                    <source src="video.mp4" type="video/mp4" data-lang="ko">
                    <source src="video_en.mp4" type="video/mp4" data-lang="en">
                    <track label="Korean" kind="subtitles" srclang="ko" src="video.vtt" default>
                    <track label="English" kind="subtitles" srclang="en" src="video_en.vtt">
                    브라우저가 동영상을 지원하지 않습니다.
                </video>
                <button id="lang-toggle-btn" class="lang-toggle" aria-label="Toggle Language">
                    <span class="lang-text">KR</span>
                </button>
            </div>
        </main>

        <!-- =================== YouTube Video Menu =================== -->
        <section class="video-section" style="margin-top: 2rem;">
            <h2 style="text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; color: var(--text-color);">추천 유튜브
                영상</h2>
            <div class="video-wrapper" style="cursor: pointer; background-color: #000;"
                onclick="loadYouTubeVideo(this)">
                <img src="https://img.youtube.com/vi/VMazjZMqQkI/maxresdefault.jpg" alt="YouTube Thumbnail"
                    style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.3s;"
                    onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.8'">
                <div
                    style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 68px; height: 48px; background-color: rgba(255, 0, 0, 0.8); border-radius: 14px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
                    <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
